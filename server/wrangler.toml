# estrec.org: one Worker serves the static site and the Publish API (server/README.md).
name = "estrec"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# `wrangler deploy` builds the site first (schemas, viewer, pages) into _site/
[build]
command = "node build-site.mjs"

[assets]
directory = "./_site"
binding = "ASSETS"
# The Worker sees every request, so it can set headers on the static files and redirect
# estimation-record.org; it passes static paths to ASSETS
run_worker_first = true
not_found_handling = "404-page"

[vars]
CANONICAL_HOST = "estrec.org"
REDIRECT_HOSTS = "www.estrec.org,estimation-record.org,www.estimation-record.org"
# Public; from the Turnstile widget. The secret is set with `wrangler secret put TURNSTILE_SECRET`
TURNSTILE_SITEKEY = "0x4AAAAAAF3I3IY0tW4g4jHg"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "estrecfiles"

# Per-IP limits (the namespace ids are any integers unique in the account)
[[ratelimits]]
name = "PUBLISH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[routes]]
pattern = "estrec.org"
custom_domain = true

[[routes]]
pattern = "www.estrec.org"
custom_domain = true

[[routes]]
pattern = "estimation-record.org"
custom_domain = true

[[routes]]
pattern = "www.estimation-record.org"
custom_domain = true
